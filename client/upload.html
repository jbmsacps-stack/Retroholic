<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Retroholic | Upload Game</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&family=VT323&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/upload.css">

</head>

<body>

    <div class="app">

        <header class="navbar">

            <div class="logo">

                <span>■</span>

                RETROHOLIC

            </div>

            <nav class="nav-links">

                <a href="index.html">HOME</a>

                <a href="#">GAMES</a>

                <a href="#">TOP SCORE</a>

                <a href="#">ABOUT</a>

                <a href="#">CONTACT</a>

            </nav>

            <div id="nav-auth"></div>

        </header>


        <main class="upload-page">

            <div class="upload-window">

                <div class="upload-header">

                    <h1>

                        UPLOAD NEW GAME

                    </h1>

                    <p>

                        STEP <span id="current-step">1</span> OF 4

                    </p>

                </div>


                <div class="step-content active" id="step-1">

                    <div class="field">

                        <label>

                            GAME TITLE

                        </label>

                        <input id="title" type="text" maxlength="80">

                        <small class="error-message"></small>

                    </div>


                    <div class="field">

                        <label>

                            SHORT DESCRIPTION

                        </label>

                        <textarea id="short-description" maxlength="180"></textarea>

                        <small class="error-message"></small>

                    </div>


                    <div class="field">

                        <label>

                            GENRE

                        </label>

                        <select id="genre">

                            <option>Arcade</option>

                            <option>Platformer</option>

                            <option>Puzzle</option>

                            <option>RPG</option>

                            <option>Shooter</option>

                            <option>Simulation</option>

                            <option>Strategy</option>

                            <option>Racing</option>

                        </select>

                    </div>

                    <div class="field">

                        <label>

                            VERSION

                        </label>

                        <input id="version" type="text" value="1.0.0">

                        <small class="error-message"></small>

                    </div>


                    <div class="field">

                        <label>

                            VISIBILITY

                        </label>

                        <div class="visibility">

                            <label>

                                <input type="radio" name="visibility" value="public" checked>

                                Public

                            </label>

                            <label>

                                <input type="radio" name="visibility" value="unlisted">

                                Unlisted

                            </label>

                            <label>

                                <input type="radio" name="visibility" value="draft">

                                Draft

                            </label>

                        </div>

                    </div>

                </div>

                <div class="step-content" id="step-2">

                    <h2>GAME MEDIA</h2>

                    <div class="upload-group">

                        <label>CARTRIDGE LABEL</label>

                        <div class="drop-zone" id="label-drop">

                            <input type="file" id="label-input" accept="image/*" hidden>

                            <img id="label-preview">

                            <span>Drop image or click to upload</span>

                        </div>

                        <small class="error-message"></small>

                    </div>

                    <div class="upload-group">

                        <label>BANNER</label>

                        <div class="drop-zone banner" id="banner-drop">

                            <input type="file" id="banner-input" accept="image/*" hidden>

                            <img id="banner-preview">

                            <span>Drop banner or click to upload</span>

                        </div>

                        <small class="error-message"></small>

                    </div>

                    <div class="upload-group">

                        <label>SCREENSHOTS</label>

                        <div class="screenshots-grid" id="screenshots-grid">

                        </div>

                        <small class="error-message"></small>

                    </div>

                </div>

                <div class="step-content" id="step-3">

                    <h2>GAME FILE</h2>

                    <div class="upload-group">

                        <label>GAME ZIP</label>

                        <div class="drop-zone" id="zip-drop">

                            <input type="file" id="zip-input" accept=".zip" hidden>

                            <span id="zip-name">

                                Drop ZIP or click here

                            </span>

                        </div>

                        <small class="error-message"></small>

                    </div>

                </div>

                <div class="step-content" id="step-4">

                    <h2>READY TO PUBLISH</h2>

                    <div class="publish-summary">

                        <p>

                            Review everything before publishing.

                        </p>

                        <p>

                            Clicking <b>PUBLISH</b> will upload your files.

                        </p>

                    </div>

                </div>


                <div class="wizard-footer">

                    <button id="back-btn" disabled>

                        ← BACK

                    </button>

                    <button id="next-btn">

                        NEXT →

                    </button>

                </div>

            </div>

        </main>

    </div>

    <script type="module" src="js/main.js"></script>

    <script type="module" src="js/upload.js"></script>

</body>

</html>
