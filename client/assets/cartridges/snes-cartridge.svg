<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="520" viewBox="0 0 400 520"
     xmlns="http://www.w3.org/2000/svg">

    <defs>

        <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#b4b4b4"/>
            <stop offset="100%" stop-color="#767676"/>
        </linearGradient>

        <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#d0d0d0"/>
            <stop offset="100%" stop-color="#a2a2a2"/>
        </linearGradient>

    </defs>

    <!-- Main Body -->

    <path d="
        M65 40
        Q65 15 90 15
        L310 15
        Q335 15 335 40
        L335 470
        Q335 495 310 495
        L90 495
        Q65 495 65 470
        Z"

        fill="url(#shell)"
        stroke="#4f4f4f"
        stroke-width="4"/>

    <!-- Top Panel -->

    <path d="
        M90 30
        L310 30
        Q325 30 325 45
        L325 82
        L75 82
        L75 45
        Q75 30 90 30
        Z"

        fill="url(#top)"
        stroke="#666"
        stroke-width="2"/>

    <!-- Decorative Grooves -->

    <rect x="90" y="98" width="220" height="4" fill="#9d9d9d"/>
    <rect x="90" y="114" width="220" height="3" fill="#666"/>

    <!-- Label Window -->

    <rect

        x="88"

        y="130"

        width="224"

        height="180"

        rx="8"

        fill="#222"

        stroke="#575757"

        stroke-width="3"/>

    <!-- Transparent Label Area -->

    <rect

        x="96"

        y="138"

        width="208"

        height="164"

        rx="5"

        fill="none"

        stroke="#aaa"

        opacity=".25"/>

    <!-- Side Indents -->

    <path d="
        M65 180
        Q45 200 65 220"

        stroke="#5c5c5c"

        stroke-width="4"

        fill="none"/>

    <path d="
        M335 180
        Q355 200 335 220"

        stroke="#5c5c5c"

        stroke-width="4"

        fill="none"/>

    <!-- Center Grip -->

    <rect

        x="155"

        y="360"

        width="90"

        height="18"

        rx="9"

        fill="#5d5d5d"/>

    <!-- Lower Panel -->

    <rect

        x="90"

        y="390"

        width="220"

        height="60"

        rx="5"

        fill="#7a7a7a"

        stroke="#666"

        stroke-width="2"/>

    <!-- Retroholic -->

    <text

        x="200"

        y="428"

        text-anchor="middle"

        font-size="18"

        fill="#969696"

        font-family="Arial"

        letter-spacing="2">

        RETROHOLIC

    </text>

</svg>