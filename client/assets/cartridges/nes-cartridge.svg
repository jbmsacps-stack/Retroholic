<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="520" viewBox="0 0 400 520"
     xmlns="http://www.w3.org/2000/svg">

    <defs>

        <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#8b8b8b"/>
            <stop offset="100%" stop-color="#676767"/>
        </linearGradient>

        <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#a2a2a2"/>
            <stop offset="100%" stop-color="#7b7b7b"/>
        </linearGradient>

        <filter id="shadow">
            <feDropShadow dx="0" dy="5" stdDeviation="6"
                flood-opacity=".35"/>
        </filter>

    </defs>

    <!-- Main Body -->

    <rect
        x="35"
        y="20"
        width="330"
        height="470"
        rx="6"
        fill="url(#body)"
        stroke="#4b4b4b"
        stroke-width="4"
        filter="url(#shadow)"/>

    <!-- Top Plastic -->

    <rect
        x="35"
        y="20"
        width="330"
        height="58"
        fill="url(#top)"
        stroke="#5d5d5d"
        stroke-width="2"/>

    <!-- Top Lines -->

    <rect x="60" y="34" width="280" height="3" fill="#bdbdbd"/>
    <rect x="60" y="46" width="280" height="3" fill="#626262"/>
    <rect x="60" y="58" width="280" height="3" fill="#bdbdbd"/>

    <!-- Label Area -->

    <rect
        x="60"
        y="95"
        width="280"
        height="215"
        rx="3"
        fill="#1d1d1d"
        stroke="#4a4a4a"
        stroke-width="3"/>

    <!-- Transparent Window -->

    <rect
        x="66"
        y="101"
        width="268"
        height="203"
        fill="none"
        stroke="#888"
        stroke-width="1"
        opacity=".2"/>

    <!-- Side Grooves -->

    <g fill="#555">

        <rect x="35" y="95" width="7" height="210"/>

        <rect x="358" y="95" width="7" height="210"/>

        <rect x="35" y="330" width="7" height="95"/>

        <rect x="358" y="330" width="7" height="95"/>

    </g>

    <!-- Middle Divider -->

    <rect
        x="60"
        y="332"
        width="280"
        height="3"
        fill="#5d5d5d"/>

    <!-- Bottom Panel -->

    <rect
        x="60"
        y="350"
        width="280"
        height="90"
        rx="3"
        fill="#6b6b6b"
        stroke="#5a5a5a"
        stroke-width="2"/>

    <!-- Finger Grip -->

    <rect
        x="145"
        y="448"
        width="110"
        height="16"
        rx="8"
        fill="#4a4a4a"/>

    <!-- Embossed Logo -->

    <text
        x="200"
        y="392"
        text-anchor="middle"
        font-size="20"
        font-family="Arial"
        fill="#8f8f8f"
        letter-spacing="3">

        RETROHOLIC

    </text>

</svg>