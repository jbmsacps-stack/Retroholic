<?xml version="1.0" encoding="UTF-8"?>
<svg width="320" height="420" viewBox="0 0 320 420"
     xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#A6A6A6"/>
    <stop offset="100%" stop-color="#727272"/>
</linearGradient>

<linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#D9D9D9"/>
    <stop offset="100%" stop-color="#A0A0A0"/>
</linearGradient>

<linearGradient id="bottom" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#7B7B7B"/>
    <stop offset="100%" stop-color="#5D5D5D"/>
</linearGradient>

</defs>

<!-- Body -->

<rect
x="8"
y="8"
width="304"
height="404"
rx="8"
fill="url(#body)"
stroke="#444"
stroke-width="3"/>

<!-- Top -->

<rect
x="24"
y="20"
width="272"
height="56"
rx="3"
fill="url(#top)"
stroke="#777"
stroke-width="2"/>

<!-- Top Ridges -->

<line x1="40" y1="34" x2="280" y2="34" stroke="#ECECEC"/>
<line x1="40" y1="46" x2="280" y2="46" stroke="#666"/>
<line x1="40" y1="58" x2="280" y2="58" stroke="#ECECEC"/>

<!-- Label Frame -->

<rect
x="34"
y="92"
width="252"
height="220"
rx="4"
fill="none"
stroke="#4F4F4F"
stroke-width="10"/>

<!-- Side Rails -->

<rect
x="18"
y="92"
width="10"
height="220"
fill="#5B5B5B"/>

<rect
x="292"
y="92"
width="10"
height="220"
fill="#5B5B5B"/>

<!-- Bottom Panel -->

<rect
x="34"
y="328"
width="252"
height="56"
rx="3"
fill="url(#bottom)"
stroke="#555"
stroke-width="2"/>

<!-- Logo -->

<text
x="160"
y="362"
text-anchor="middle"
font-family="Arial"
font-size="18"
font-weight="700"
fill="#9D9D9D"
letter-spacing="3">

RETROHOLIC

</text>

<!-- Grip -->

<rect
x="108"
y="392"
width="104"
height="10"
rx="5"
fill="#555"/>

<!-- Screws -->

<g fill="#666">

<circle cx="36" cy="48" r="4"/>
<circle cx="284" cy="48" r="4"/>

<circle cx="36" cy="396" r="4"/>
<circle cx="284" cy="396" r="4"/>

</g>

</svg>