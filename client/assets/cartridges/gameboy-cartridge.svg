<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="520" viewBox="0 0 400 520"
     xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#C8C8C8"/>
    <stop offset="100%" stop-color="#8A8A8A"/>
</linearGradient>

<linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#E3E3E3"/>
    <stop offset="100%" stop-color="#B8B8B8"/>
</linearGradient>

</defs>

<!-- Main Shell -->

<path d="
M60 60
Q60 25 95 25
L305 25
Q340 25 340 60
L340 475
Q340 495 320 495
L80 495
Q60 495 60 475
Z"

fill="url(#body)"
stroke="#505050"
stroke-width="4"/>

<!-- Top Bevel -->

<path d="
M95 25
L305 25
Q325 25 325 45
L325 78
L75 78
L75 45
Q75 25 95 25
Z"

fill="url(#top)"
stroke="#777"
stroke-width="2"/>

<!-- Corner Notches -->

<path d="M60 60 L88 92" stroke="#666" stroke-width="3"/>
<path d="M340 60 L312 92" stroke="#666" stroke-width="3"/>

<!-- Label Area -->

<rect
x="82"
y="110"
width="236"
height="210"
rx="8"
fill="#222"
stroke="#555"
stroke-width="3"/>

<!-- Transparent Label Window -->

<rect
x="90"
y="118"
width="220"
height="194"
rx="5"
fill="none"
stroke="#AAA"
stroke-width="1"
opacity=".25"/>

<!-- Decorative Lines -->

<rect x="92" y="340" width="216" height="3" fill="#707070"/>

<rect x="92" y="355" width="216" height="2" fill="#9A9A9A"/>

<!-- Finger Grip -->

<path
d="
M145 395
Q200 430 255 395
L255 418
Q200 448 145 418
Z"

fill="#6A6A6A"/>

<!-- Bottom Connector -->

<rect
x="125"
y="455"
width="150"
height="18"
rx="4"
fill="#555"/>

<!-- Connector Pins -->

<g fill="#7C7C7C">

<rect x="138" y="458" width="5" height="12"/>
<rect x="150" y="458" width="5" height="12"/>
<rect x="162" y="458" width="5" height="12"/>
<rect x="174" y="458" width="5" height="12"/>
<rect x="186" y="458" width="5" height="12"/>
<rect x="198" y="458" width="5" height="12"/>
<rect x="210" y="458" width="5" height="12"/>
<rect x="222" y="458" width="5" height="12"/>
<rect x="234" y="458" width="5" height="12"/>
<rect x="246" y="458" width="5" height="12"/>
<rect x="258" y="458" width="5" height="12"/>

</g>

<!-- Logo -->

<text
x="200"
y="385"
text-anchor="middle"
font-size="18"
font-family="Arial"
fill="#7A7A7A"
