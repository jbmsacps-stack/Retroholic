<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Retroholic | Creator Review</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&family=VT323&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="/css/style.css">

    <link rel="stylesheet"
          href="/css/creator-review.css">

</head>

<body>

<div class="app">

<header class="navbar">

    <div class="logo">

        <span>■</span>

        RETROHOLIC ADMIN

    </div>

    <nav class="nav-links">

        <a href="/dashboard.html">

            DASHBOARD

        </a>

        <a href="/">

            WEBSITE

        </a>

    </nav>

    <div id="nav-auth"></div>

</header>

<main class="review-page">

<!-- =============================== -->

<div class="review-top">

<a href="/dashboard.html"
class="back-btn">

← BACK

</a>

<div
id="creator-status"
class="status pending">

PENDING

</div>

</div>

<!-- =============================== -->

<section class="profile-card">

<img
id="creator-avatar"
src="/assets/default-avatar.png">

<div class="profile-info">

<h1 id="creator-name">

Loading...

</h1>

<p id="creator-type">

Creator

</p>

<p id="creator-country">

Country

</p>

<p id="creator-date">

Applied -

</p>

</div>

</section>

<!-- =============================== -->

<section class="review-section">

<h2>

ABOUT CREATOR

</h2>

<p id="creator-about">

Loading...

</p>

</section>

<!-- =============================== -->

<section class="review-section">

<h2>

PUBLISHING TYPES

</h2>

<div
id="publishing-types"
class="tag-list">

</div>

</section>

<!-- =============================== -->

<section class="review-section">

<h2>

EXPERIENCE

</h2>

<p id="creator-experience">

Loading...

</p>

</section>

<!-- =============================== -->

<section class="review-section">

<h2>

LINKS

</h2>

<div class="links-grid">

<a
id="website-link"
target="_blank">

Website

</a>

<a
id="github-link"
target="_blank">

GitHub

</a>

<a
id="itch-link"
target="_blank">

itch.io

</a>

<a
id="youtube-link"
target="_blank">

YouTube

</a>

</div>

</section>

<!-- =============================== -->

<section class="review-section">

<h2>

REJECTION REASON

</h2>

<textarea
id="rejection-reason"
placeholder="Reason for rejection (optional until required)..."></textarea>

</section>

<!-- =============================== -->

<div class="review-actions">

<button
id="reject-btn"
class="danger-btn">

REJECT

</button>

<button
id="approve-btn"
class="success-btn">

APPROVE

</button>

</div>

</main>

</div>

<script type="module"
src="/js/main.js"></script>

<script type="module"
src="/js/creator-review.js"></script>

</body>

</html>
